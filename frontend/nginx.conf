server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ─── API proxy ────────────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the backend pod.
    # "backend-service" is resolvable here because Nginx runs INSIDE the cluster;
    # CoreDNS handles it. The browser never sees this hostname.
    location /api/ {
        proxy_pass         http://backend-service:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Avoid 502 if backend takes a moment to respond
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ─── React SPA fallback ───────────────────────────────────────────────────
    # Any URL not matched above is served as index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
