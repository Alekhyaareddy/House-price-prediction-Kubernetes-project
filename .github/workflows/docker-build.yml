name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Get repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3 — Build Backend Image
      - name: Build Backend Image
        run: |
          docker build -t alekhyaah/house-price-backend:latest ./backend

      # Step 4 — Push Backend Image
      - name: Push Backend Image
        run: |
          docker push alekhyaah/house-price-backend:latest

      # Step 5 — Build Frontend Image
      - name: Build Frontend Image
        run: |
          docker build -t alekhyaah/house-price-frontend:latest ./frontend

      # Step 6 — Push Frontend Image
      - name: Push Frontend Image
        run: |
          docker push alekhyaah/house-price-frontend:latest