apiVersion: apps/v1

kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: alekhyaah/house-price-backend:v7
        imagePullPolicy: Never

        ports:
        - containerPort: 5000

        env:
        - name: PREDICTION_SERVICE_URL
          value: "http://prediction-service:5000"